name: Tests

on:
  push:
    branches: [main, accessibility-improvements]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available iPhone | head -20

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MythConf/MythConf26.xcodeproj \
            -scheme MythConf26 \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log
